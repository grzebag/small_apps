<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Memory - Odkrywanka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-zen">
    <div id="game-container">
        <header>
            <div class="stat">Poziom: <span id="level">1</span></div>
            <div class="stat">Czas: <span id="timer">00:00</span></div>
            <div class="stat">Poziom: <span id="score">0</span></div>
            <div class="stat">Łącznie: <span id="session-score">0</span></div>
            <div class="stat record" id="record-display">
                <span class="record-label">Rekord:</span>
                <span class="record-value" id="record-detail">--</span>
            </div>
        </header>
        
        <main id="game-board"></main>

        <div id="combo-container">
            <div class="combo-text" id="combo-msg">COMBO x2</div>
        </div>

        <div id="menu-overlay" class="overlay">
            <div class="menu-content">
                <h1>Nature Memory</h1>
                <p>Wybierz swój styl:</p>
                <div class="theme-options">
                    <button data-theme="zen">Nature Zen</button>
                    <button data-theme="forest">Forest Quest</button>
                    <button data-theme="eco">Vibrant Eco</button>
                </div>
            </div>
        </div>

        <div id="next-level-overlay" class="overlay hidden">
            <div class="menu-content">
                <h2>Poziom Ukończony!</h2>
                <div class="stars" id="level-stars">
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                </div>

                <div id="new-record-badge" class="new-record hidden">🏆 NOWY REKORD!</div>

                <div class="stats-summary">
                    <div class="summary-item">
                        <span>Czas całkowity:</span>
                        <span id="stat-time">00:00</span>
                    </div>
                    <div class="summary-item">
                        <span>Punkty podstawowe:</span>
                        <span id="stat-base-pts">0</span>
                    </div>
                    <div class="summary-item">
                        <span>Bonus za szybkość:</span>
                        <span id="stat-speed-bonus">0</span>
                    </div>
                    <div class="summary-item">
                        <span>Najwyższe COMBO:</span>
                        <span id="stat-max-combo">x0</span>
                    </div>
                    <div class="summary-item total">
                        <span>WYNIK POZIOMU:</span>
                        <span id="stat-total-score">0</span>
                    </div>
                    <div class="summary-item session-total">
                        <span>ŁĄCZNY WYNIK:</span>
                        <span id="stat-session-score">0</span>
                    </div>
                </div>

                <p id="level-summary" class="hidden"></p>
                <button id="next-level-btn">Następny Poziom</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
